name: template
description: "Production-ready Flutter base template (Riverpod, Dio, go_router)."
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: ^3.13.7

dependencies:
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
